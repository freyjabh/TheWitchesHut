        if(!table.querySelector('.table-eye')){const eye=document.createElement('img');eye.className='table-eye';eye.dataset.layoutId='deer-eye';eye.dataset.editorPreview='true';eye.src='Grafik/1_oga.png';eye.alt='Enchanted Eye';table.append(eye);}
      }
      status('Adjust the eye’s position, size and angle. Save the layout when ready.');
    }
    if(action==='lock-digits') {
      if(state.players[0].testDark){state.players[0].testDark=false;drawPlayer(0);}
      move(0,3-state.players[0].wall);
      const lock=document.querySelector('[data-player="0"] [data-action="inspect-cabinet-lock"]');
      if(!lock){status('The cabinet is already unlocked. Reset the game to edit the lock.');refresh();return;}
      lock.click();
      status('Drag the digits into their fields. Save the layout when ready.');
    }
    if(action==='save') {
      try {localStorage.setItem(KEY,JSON.stringify(layout));saved=structuredClone(layout);status('Layout saved in this browser. Export it to keep a separate file.');}
      catch {status('Could not save. Export the layout to a file instead.');}
    }
    if(action==='cancel'||action==='reset') {
      layout=action==='reset'?{}:structuredClone(saved);
      targets().forEach(({el})=>el.setAttribute('style',originalStyles.get(el)||''));
      status(action==='reset'?'Default positions restored. Click Save layout to keep them.':'Unsaved changes discarded.');
    }
    if(action==='export') {
      const url=URL.createObjectURL(new Blob([JSON.stringify(layout,null,2)],{type:'application/json'})), a=document.createElement('a');
      a.href=url;a.download='witches-hut-layout.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
      status('Layout exported. Use the file to transfer these positions into the project.');
    }
    refresh();
  });
  // Export all room configuration, including randomized shelf contents, separately from progress.
  const setupExport=document.createElement('button');setupExport.type='button';setupExport.hidden=true;setupExport.textContent='Export playtest setup';
  setupExport.addEventListener('click',event=>{event.stopPropagation();const setup={'witches-hut-layout-v1':JSON.stringify(layout)};for(const key of ['witches-hut-shelf-order-v1','witches-hut-empty-bottle-shelves-v1']){const value=localStorage.getItem(key);if(value)setup[key]=value;}const url=URL.createObjectURL(new Blob([JSON.stringify(setup,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='witches-hut-playtest-setup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);status('Room layout and shelf contents exported for the two-computer playtest.');});toolbar.append(setupExport);
  window.isCabinetObjectManual=id=>layout['3:'+id]?.manualCabinetPlacement===true;
  window.getCabinetClueLayout=i=>layout['cabinet-clue:player-'+i];
  window.refreshMemoryLayout=refresh;
  // Reapply layouts after game renders without observing editor overlays themselves.
  const observer=new MutationObserver(refresh);
  document.querySelectorAll('[data-role="decor"]').forEach(el=>observer.observe(el,{childList:true}));
  document.querySelectorAll('.item-image-overlay').forEach(el=>observer.observe(el,{childList:true,attributes:true,attributeFilter:['hidden']}));
  window.addEventListener('resize',refresh);
  refresh();
})();

</script>
<script>
  // Shared rule: fit every overlay to its available scene and viewport.
  (() => {
    const overlays = [...document.querySelectorAll('.player-cover, .overlay')];
    function fitOverlays() {
      for (const overlay of overlays) {
        if (overlay.hidden || !overlay.clientHeight) continue;
        const css = getComputedStyle(overlay);
        const width = Math.min(overlay.clientWidth, innerWidth) - parseFloat(css.paddingLeft) - parseFloat(css.paddingRight);
        const height = Math.min(overlay.clientHeight, innerHeight - 24) - parseFloat(css.paddingTop) - parseFloat(css.paddingBottom);
        for (const content of overlay.children) {
          if (!content.classList.contains('book-dialog')) continue;
          content.style.zoom = '1';
          const rect = content.getBoundingClientRect();
          const naturalWidth = Math.max(rect.width, content.scrollWidth);
          const naturalHeight = Math.max(rect.height, content.scrollHeight);
          content.style.zoom = String(Math.min(1, width / naturalWidth, height / naturalHeight));
        }
      }
    }
    const observer = new MutationObserver(fitOverlays);
    const resize = new ResizeObserver(fitOverlays);
    overlays.forEach(overlay => {
      observer.observe(overlay, {childList:true, subtree:true, attributes:true, attributeFilter:['hidden']});
      resize.observe(overlay);
    });
    window.addEventListener('resize', fitOverlays);
    fitOverlays();
  })();
</script>
<script>
(() => {
  const root=document.querySelector('#players');
  const owned=id=>state.players.some(p=>p.inventory.includes(id)||(p.lantern&&p.lanternBottle===id));
  const locked=id=>(id.startsWith('ort-')||id==='tinder')&&!state.cabinetUnlocked;
  const available=(id,index)=>!owned(id)&&!(id==='firewood'&&(index!==0||state.woodPlaced||!state.players[index].chestUnlocked))&&!(id==='deer-eye'&&(state.deerEyeOwner!==null||(!state.eyeOnTable&&(index!==1||!state.players[index].chestUnlocked))))&&!(fireToolArt[id]&&state.fireToolsPlaced.includes(id));
  function inspect(index,id,inInventory){
    if(!inInventory&&locked(id))return;
    const art=id==='lantern'?{...itemCatalog.lantern,src:lanternSource(index)}:itemCatalog[id];if(!art)return;
    const panel=root.querySelector(`[data-player="${index}"]`),overlay=panel.querySelector('.item-image-overlay');
    overlay.dataset.mode='inspection';overlay.dataset.inspectId=id;
    const action=(id==='trinket-11'||id==='trinket-1')?null:inInventory?'use':locked(id)?null:available(id,index)?'take':null;
    const illustration=id==='lantern'?`<span class="lantern-art inspection-lantern" style="--bottle-image:url('${escapeHtml(art.src)}')"><img src="${escapeHtml(art.src)}" alt="${escapeHtml(art.name)}"></span>`:`<img src="${escapeHtml(art.src)}" alt="${escapeHtml(art.name)}">`;
    overlay.innerHTML=`<figure class="inspection-sheet">${illustration}<figcaption><strong>${escapeHtml(art.name)}</strong><p>${escapeHtml(art.description)}</p>${locked(id)&&!inInventory?'<p>Behind the locked cabinet doors.</p>':''}<p class="inspection-feedback" role="status"></p></figcaption>${action?`<button type="button" data-inspect-action="${action}" data-inspect-id="${id}">${action==='take'?'Take':'Use'}</button>`:''}${inInventory&&id!=='lantern'&&id!=='caught-fly'?`<button type="button" data-inspect-action="drop" data-inspect-id="${id}">Put down</button>`:''}</figure>`;
    overlay.hidden=false;
    window.renderToadMemory?.(index);
    window.inspectLightSkull?.(index);
  }
  root.addEventListener('click',event=>{
    if(globalThis.hutApplyingDrop||event.target.closest('[data-cabinet-clue]')||document.body.classList.contains('layout-editing'))return;
    const panel=event.target.closest('.player');if(!panel)return;const index=Number(panel.dataset.player),p=state.players[index];
    const control=event.target.closest('[data-inspect-action]');
    if(control){
      event.preventDefault();event.stopImmediatePropagation();
      const id=control.dataset.inspectId,overlay=panel.querySelector('.item-image-overlay');
      if(control.dataset.inspectAction==='drop'){
        if(id==='caught-fly'||!p.inventory.includes(id))return;
        delete state.worldDrops[id];if(id==='deer-eye')state.eyeOnTable=true;
        p.inventory=p.inventory.filter(item=>item!==id);if(p.selectedItem===id)p.selectedItem=null;
        overlay.hidden=true;save();drawAll();
        if(id==='deer-eye')root.querySelectorAll('[data-role="status"]').forEach(el=>el.textContent='The eye has been put down and can be shared.');
        root.querySelectorAll('.item-image-overlay[data-mode="chest"]:not([hidden])').forEach(showChestContents);
        return;
      }
      if(control.dataset.inspectAction==='use'){
        if(id==='lantern'){p.lightSelected=!p.lightSelected;p.selectedItem=null;}else{if(!p.inventory.includes(id))return;p.selectedItem=id;}
        overlay.hidden=true;save();drawPlayer(index);return;
      }
      if(locked(id)||!available(id,index)){inspect(index,id,false);return;}
      if(p.inventory.length+(p.lantern?1:0)>=10){overlay.querySelector('.inspection-feedback').textContent='Your inventory is full.';return;}
      delete state.worldDrops[id];if(id==='deer-eye')state.eyeOnTable=false;
      overlay.hidden=true;
      if(id==='key-14')itemAction(index,'pickup-key');
      else if(id==='firewood')itemAction(index,'pickup-wood');
      else if(fireToolArt[id])itemAction(index,`pickup-${id}`);
      else{p.inventory.push(id);p.selectedItem=id;save();drawAll();}
      root.querySelectorAll('.item-image-overlay[data-mode="inspection"]:not([hidden])').forEach(other=>{if(other.dataset.inspectId===id)inspect(Number(other.closest('.player').dataset.player),id,false);});
      return;
    }
    const inventory=event.target.closest('[data-inventory-item]');
    if(inventory){event.preventDefault();event.stopImmediatePropagation();if(p.selectedItem==='ladle'&&inventory.dataset.inventoryItem.startsWith('tomflaska-')){pourLadleIntoBottle(index,inventory.dataset.inventoryItem);return;}inspect(index,inventory.dataset.inventoryItem,true);return;}
    if(event.target.closest('[data-action="toggle-light"]')){event.preventDefault();event.stopImmediatePropagation();inspect(index,'lantern',true);return;}
    if(event.target.closest('.player-cover'))return;
    if(p.inBackRoom&&!p.darkRoomTestLight&&(!p.lantern||!p.lightSelected))return;
    const world=worldItemAtPoint(event.target.closest('.scene'),event.clientX,event.clientY)||event.target.closest('[data-layout-id]'),wood=event.target.closest('[data-action="pickup-wood"]');
    if(!world&&!wood)return;
    let id=wood?'firewood':world.dataset.itemId||world.dataset.layoutId;
    if(id==='trinket-14')id='key-14';if(id.startsWith('fire-tool-'))id=id.slice(10);
    if(!itemCatalog[id]||locked(id))return;
    event.preventDefault();event.stopImmediatePropagation();inspect(index,id,false);
  },true);
  // Chest contents are already inside an overlay, so inspect its wood explicitly.
  root.addEventListener('click',event=>{
    if(document.body.classList.contains('layout-editing'))return;
    const content=event.target.closest('[data-action="pickup-wood"],[data-action="inspect-chest-eye"]');if(!content)return;
    event.preventDefault();event.stopImmediatePropagation();inspect(Number(content.closest('.player').dataset.player),content.dataset.action==='pickup-wood'?'firewood':'deer-eye',false);
  },true);
  root.addEventListener('keydown',event=>{
    if(document.body.classList.contains('layout-editing'))return;
    if((event.key==='Enter'||event.key===' ')&&event.target.matches('[data-layout-id][role="button"]')){event.preventDefault();event.stopImmediatePropagation();event.target.click();}
  },true);
})();
</script>
<script>
  // Only the visible artwork and its controls keep an overlay open.
  document.querySelector('#players').addEventListener('click',event=>{
    if(document.body.classList.contains('layout-editing'))return;
    const overlay=event.target.closest('.player-cover');if(!overlay||overlay.hidden)return;
    if(event.target.closest('button,input,textarea,figcaption'))return;
    const inside=[...overlay.querySelectorAll('img')].some(img=>pointInside(visibleImageRect(img),event.clientX,event.clientY));
    if(inside)return;
    event.preventDefault();event.stopImmediatePropagation();overlay.hidden=true;
    if(overlay.dataset.role==='player-cover'){
      const index=Number(overlay.closest('.player').dataset.player);state.bookPanelOpen[index]=false;if(state.bookOwner===index)state.bookOwner=null;drawAll();
    }
  },true);
</script>
<script>
(() => {
  const cursor=document.createElement('div');cursor.id='ladle-cursor';cursor.hidden=true;cursor.innerHTML='<img src="Grafik/1_slev.PNG" alt="">';document.body.append(cursor);
  let pointer=null,activeZone=null;
  function update(){
    if(activeZone){activeZone.classList.remove('ladle-cursor-zone');activeZone=null;}
    if(!pointer){cursor.hidden=true;return;}
    const target=document.elementFromPoint(pointer.x,pointer.y),panel=target?.closest('.player'),zone=target?.closest('.scene,.inventory');
    const p=panel?state.players[Number(panel.dataset.player)]:null;
    const visible=p&&zone&&p.selectedItem==='ladle'&&p.inventory.includes('ladle')&&!target.closest('.player-cover')&&!document.body.classList.contains('layout-editing');
    cursor.hidden=!visible;
    if(visible){activeZone=zone;zone.classList.add('ladle-cursor-zone');cursor.style.left=`${pointer.x}px`;cursor.style.top=`${pointer.y}px`;cursor.classList.toggle('charged',state.ladleCharged);}
  }
  document.addEventListener('pointermove',event=>{pointer={x:event.clientX,y:event.clientY};update();});
  document.documentElement.addEventListener('pointerleave',()=>{pointer=null;update();});
  window.addEventListener('blur',()=>{pointer=null;update();});
  new MutationObserver(update).observe(document.querySelector('#players'),{childList:true,subtree:true});
})();
</script>
