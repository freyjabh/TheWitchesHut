<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escape Room - Komplett Spel</title>
    <!-- Importerar ett handskrivet typsnitt från Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial, sans-serif;
            color: white;
        }

        #game-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        #game-container {
            position: relative;
            width: 960px;
            height: 540px;
            background-color: #000;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }

        .room-object {
            position: absolute;
            filter: drop-shadow(-8px 10px 6px rgba(0, 0, 0, 0.6));
            transition: transform 0.1s ease, filter 0.1s ease;
        }

        /* Generell pulserande glöd/hover-effekt för alla klickbara element */
        .room-object[onclick], 
        .room-object[style*="cursor: pointer"],
        #hylla, #ravtavla, #fageltavla, #item-oga, #item-schiffer, 
        #obj_anslagstavla, #obj_hylla2, #obj_bok, #obj_las, #obj_spak,
        #rum2b-periodiska, #rum2b-hylla-ekolv, #rum2b-hylla-stallning,
        #obj_brannare, #rum2-recept-lapp, #rum2b-lada-slot, #rum2b-ficka-slot,
        #station-slot, #station-placed-brannare, #station-placed-kastrull, #station-placed-ekolv {
            cursor: pointer;
        }

        .room-object[onclick]:hover, 
        .room-object[style*="cursor: pointer"]:hover,
        #hylla:hover, #ravtavla:hover, #fageltavla:hover, #item-oga:hover, #item-schiffer:hover,
        #obj_anslagstavla:hover, #obj_hylla2:hover, #obj_bok:hover, #obj_las:hover, #obj_spak:hover,
        #rum2b-periodiska:hover, #rum2b-hylla-ekolv:hover, #rum2b-hylla-stallning:hover,
        #obj_brannare:hover, #rum2-recept-lapp:hover, #rum2b-lada-slot:hover, #rum2b-ficka-slot:hover,
        #station-slot:hover, #station-placed-brannare:hover, #station-placed-kastrull:hover, #station-placed-ekolv:hover {
            filter: brightness(1.15) drop-shadow(-10px 12px 8px rgba(0, 0, 0, 0.7));
            animation: pulseGlow 1.5s infinite alternate;
        }

        @keyframes pulseGlow {
            0% { filter: brightness(1.1) drop-shadow(-8px 10px 6px rgba(0,0,0,0.6)); }
            100% { filter: brightness(1.25) drop-shadow(0 0 12px rgba(255,255,200,0.8)); }
        }

        #background {
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            cursor: default;
            filter: none;
        }

        #hylla {
            top: 23%;
            left: 63%;
            width: 25%;
            z-index: 1;
            mix-blend-mode: normal;
            background-color: transparent;
            border: none;
        }

        #bord {
            top: 65%;
            left: 20%;
            width: 20%;
            z-index: 1;
            mix-blend-mode: normal;
        }

        #item-oga {
            top: 90%;
            left: 10%;
            width: 5%;
            z-index: 2;
            display: none;
        }

        #item-oga:hover {
            transform: scale(1.15);
        }

        #item-schiffer {
            top: 38%;
            left: 42%;
            width: 16%;
            z-index: 2;
            display: none;
        }

        #flashlight-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
            display: none;
            background: rgba(0, 0, 0, 0.98);
        }

        .test-visible-slot {
            position: absolute;
            background: transparent;
            cursor: pointer;
            z-index: 20;
        }

        #back-to-rum1 {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 300px;
            height: 60px;
            display: none;
        }

        #rum2-back-interaction { top: 0; left: 0; width: 100%; height: 15%; display: none; }
        #rum2a-back-to-rum2 { top: 15%; right: 0; width: 15%; height: 70%; display: none; }
        #rum2b-back-to-rum2 { top: 15%; left: 0; width: 15%; height: 70%; display: none; }
        #schakt-interaction { top: 30%; left: 30%; width: 40%; height: 50%; display: none; }
        #rep-interaction { top: 60%; left: 45%; width: 15%; height: 35%; display: none; }

        #knapp-slot { top: 40%; left: 42%; width: 16%; height: 20%; display: none; }

        #placerad-knapp {
            position: absolute;
            top: 43%;
            left: 45%;
            width: 8%;
            display: none;
            z-index: 18;
            cursor: pointer;
            transition: transform 0.2s ease;
            filter: drop-shadow(-3px 5px 4px rgba(0,0,0,0.8));
        }
        #placerad-knapp:hover { transform: scale(1.1); }

        #red-button-light {
            position: absolute;
            top: 60%;
            left: 60%;
            width: 120px;
            height: 120px;
            transform: translate(-50%, -50%);
            background: radial-gradient(circle, rgba(255, 50, 50, 0.9) 0%, rgba(255, 0, 0, 0.4) 40%, rgba(0, 0, 0, 0) 70%);
            pointer-events: none;
            z-index: 58;
            display: none;
        }

        #white-button-light {
            position: absolute;
            top: 60%;
            left: 60%;
            width: 120px;
            height: 120px;
            transform: translate(-50%, -50%);
            background: radial-gradient(circle, rgba(255, 255, 255, 0.95) 0%, rgba(200, 200, 200, 0.4) 40%, rgba(0, 0, 0, 0) 70%);
            pointer-events: none;
            z-index: 58;
            display: none;
        }

        #red-button-interaction {
            position: absolute;
            top: 60%;
            left: 60%;
            width: 30%;
            height: 40%;
            transform: translate(-50%, -50%);
            border-radius: 50%;
        }

        #left-room-interaction { top: 15%; left: 0; width: 15%; height: 70%; display: none; }
        #right-room-interaction { top: 15%; right: 0; width: 15%; height: 70%; display: none; }

        #rum2a-objects, #rum2b-objects { display: none; }

        #obj_anslagstavla { top: 20%; left: 16%; width: 250px; height: auto; z-index: 2; }
        #obj_skrivbord { top: 63%; left: 10%; width: 320px; height: auto; z-index: 2; }
        #obj_bok { top: 65%; left: 20%; width: 57px; height: auto; z-index: 3; }
        #obj_spakfaste { top: 25%; left: 50%; width: 60px; height: auto; z-index: 2; }

        #spak-light {
            position: absolute;
            top: 33%;
            left: 52.5%;
            width: 12px;
            height: 12px;
            background-color: #ff3333;
            border-radius: 50%;
            box-shadow: 0 0 8px #ff0000;
            z-index: 4;
            display: none;
            pointer-events: none;
        }

        #obj_spak {
            top: 27.2%;
            left: 51.2%;
            width: 60px;
            height: auto;
            z-index: 5;
            transition: transform 0.2s ease;
        }
        #obj_spak:hover { transform: scale(1.05); }

        #obj_hylla2 { top: 16%; left: 65%; width: 200px; height: auto; z-index: 2; }
        #obj_skapdorr { top: 57%; left: 65%; width: 155px; height: auto; z-index: 3; transform: rotate(3deg); }
        #obj_las { top: 65%; left: 77%; width: 40px; height: auto; z-index: 4; }
        
        #rum2-oppen-lucka { position: absolute; top: 45%; left: 60%; width: 15%; height: auto; z-index: 2; display: none; pointer-events: none; }
        #rum2-recept-lapp { position: absolute; top: 51%; left: 68.5%; width: 3.5%; height: auto; z-index: 3; display: none; }

        .rum2a-flaska { position: absolute; z-index: 4; transition: transform 0.1s ease; display: none; cursor: pointer; }
        .rum2a-flaska:hover { transform: scale(1.1); }
        #flaska1 { top: 59%; left: 73%; width: 2.7%; }
        #flaska2 { top: 82%; left: 76%; width: 2.5%; }
        #flaska3 { top: 70%; left: 72%; width: 3.5%; }
        #flaska4 { top: 83%; left: 70%; width: 3%; }

        #obj_brannare {
            position: absolute;
            top: 48%;
            left: 70%;
            width: 4.5%;
            z-index: 4;
            display: none;
            cursor: pointer;
            transition: transform 0.1s ease;
        }
        #obj_brannare:hover { transform: scale(1.1); }

        .anslagstavla-wrapper { position: relative; display: inline-block; }
        
        .anslagstavel-lapp { 
            position: absolute; 
            top: 40%; 
            width: 14%; 
            cursor: pointer; 
            transition: transform 0.2s ease; 
        }
        .anslagstavel-lapp:hover { transform: scale(1.15); z-index: 10; }
        #obj_lapp1 { left: 20%; }
        #obj_lapp2 { left: 36%; }
        #obj_lapp3 { left: 52%; }
        #obj_lapp4 { left: 68%; }

        .lock-digit {
            position: absolute; width: 11%; height: 33%; top: 54%; background: transparent; color: #000;
            font-size: 34px; font-weight: bold; font-family: cursive; display: flex; align-items: center;
            justify-content: center; cursor: pointer; user-select: none;
        }
        #lock-digit-0 { left: 15%; }
        #lock-digit-1 { left: 32%; }
        #lock-digit-2 { left: 49%; }
        #lock-digit-3 { left: 66%; }

        .hylla-item { position: absolute; width: 4%; z-index: 3; cursor: pointer; }
        #item-batteri { top: 32%; left: 70%; }
        #item-ficklampa { top: 43%; left: 70%; width: 7%; transform: rotate(7deg); }
        #item-ficklampa-lysand { top: 43%; left: 70%; width: 7%; transform: rotate(7deg); display: none; }
        #item-rep { top: 48%; left: 82%; width: 6%; }
        #item-skruvmejsel { top: 54%; left: 69%; width: 9%; transform: rotate(-2deg); }
        #item-knapp { top: 72%; left: 72%; }
        
        #item-anteckningsblock { top: 58%; left: 69%; width: 5%; z-index: 3; transform: rotate(-17deg); cursor: pointer; }
        #item-gubbe { top: 82%; left: 20%; width: 6%; z-index: 15; display: none; cursor: pointer; }
        #schiffernyckel { top: 67%; left: 30%; width: 4%; z-index: 3; transform: rotate(19deg); cursor: pointer; }

        #periodiska-img {
            transition: transform 0.3s ease;
            cursor: zoom-in;
            transform-origin: center center;
        }
        #periodiska-img.zoomed {
            transform: scale(2.2);
            cursor: zoom-out;
        }

        #rum2b-lada-slot { top: 85%; left: 67%; width: 7%; height: 5%; z-index: 10; }
        #rum2b-ficka-slot { top: 63%; left: 23.9%; width: 2%; height: 5%; z-index: 10; }

        #station-slot {
            position: absolute;
            top: 64%;
            left: 55%;
            width: 22%;
            height: 8%;
            z-index: 10;
        }

        #station-placed-brannare { position: absolute; top: 60%; left: 64%; width: 5%; z-index: 3; display: none; cursor: pointer; }
        #station-placed-stallning { position: absolute; top: 58%; left: 63%; width: 8%; z-index: 3; display: none; pointer-events: none; }
        
        #station-placed-kastrull { 
            position: absolute; 
            top: 52%; 
            left: 63.5%; 
            width: 10%; 
            z-index: 4; 
            display: none; 
            cursor: pointer; 
        }

        #station-placed-ekolv {
            position: absolute;
            top: 58%;
            left: 57%;
            width: 5%;
            z-index: 4;
            display: none;
            cursor: pointer;
        }

        #station-placed-flamma { 
            position: absolute; 
            top: 58%; 
            left: 66%; 
            width: 1%; 
            z-index: 5; 
            display: none; 
            pointer-events: none; 
        }

        #station-white-light {
            position: absolute;
            top: 54%;
            left: 67%;
            width: 30px;
            height: 30px;
            transform: translate(-50%, -50%);
            background: radial-gradient(circle, rgba(255, 255, 255, 0.95) 0%, rgba(200, 200, 200, 0.4) 50%, rgba(0, 0, 0, 0) 70%);
            pointer-events: none;
            z-index: 45;
            display: none;
        }

        #station-green-light {
            position: absolute;
            top: 54%;
            left: 67%;
            width: 30px;
            height: 30px;
            transform: translate(-50%, -50%);
            background: radial-gradient(circle, rgba(50, 255, 50, 0.95) 0%, rgba(0, 200, 0, 0.4) 50%, rgba(0, 0, 0, 0) 70%);
            pointer-events: none;
            z-index: 45;
            display: none;
        }

        #ekolv-green-light {
            position: absolute;
            top: 61%;
            left: 59.5%;
            width: 30px;
            height: 30px;
            transform: translate(-50%, -50%);
            background: radial-gradient(circle, rgba(50, 255, 50, 0.95) 0%, rgba(0, 200, 0, 0.4) 50%, rgba(0, 0, 0, 0) 70%);
            pointer-events: none;
            z-index: 45;
            display: none;
        }

        .popup-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.85); z-index: 50; display: none;
            justify-content: center; align-items: center; cursor: pointer;
        }

        .popup-content { position: relative; display: inline-block; cursor: default; }

        .popup-img { 
            max-width: 650px; max-height: 460px; object-fit: contain; display: block; 
            filter: drop-shadow(0 0 15px rgba(0,0,0,0.8));
        }

        .skruv {
            position: absolute; width: 35px; height: 35px; cursor: pointer; z-index: 60;
            object-fit: contain; filter: drop-shadow(-2px 3px 3px rgba(0,0,0,0.8));
            transition: transform 0.1s ease;
        }
        .skruv:hover { transform: scale(1.1); }
        #skruv-top-left { top: 2%; left: 2%; }
        #skruv-top-right { top: 2%; right: 2%; }
        #skruv-bottom-left { bottom: 2%; left: 2%; }
        #skruv-bottom-right { bottom: 2%; right: 2%; }

        @keyframes spinAndFade {
            0% { transform: rotate(0deg) scale(1); opacity: 1; }
            50% { transform: rotate(360deg) scale(0.8); opacity: 0.5; }
            100% { transform: rotate(720deg) scale(0); opacity: 0; }
        }

        .unscrewing { animation: spinAndFade 0.5s forwards ease-in-out; pointer-events: none; }

        #hjort-oga-slot { position: absolute; top: 42%; left: 28%; width: 15%; height: 15px; cursor: pointer; z-index: 60; }
        #placerat-oga {
            position: absolute; top: 40%; left: 27%; width: 18%; display: none; pointer-events: none;
            z-index: 55; transform: rotate(-22deg); filter: drop-shadow(-2px 3px 3px rgba(0,0,0,0.8));
        }

        .fox-digit { position: absolute; width: 40px; height: 40px; cursor: pointer; z-index: 60; border-radius: 50%; }
        .fox-digit:hover { background-color: rgba(255, 255, 255, 0.2); }
        #digit-0 { top: 7%; left: 24%; } #digit-1 { top: 6%; left: 50%; } #digit-2 { top: 19%; right: 8%; }
        #digit-3 { top: 46%; right: 1%; } #digit-4 { bottom: 20%; right: 11%; } #digit-5 { bottom: 4%; right: 30%; }
        #digit-6 { bottom: 7%; left: 32%; } #digit-7 { bottom: 15%; left: 15%; } #digit-8 { top: 52%; left: 2%; } #digit-9 { top: 30%; left: 5%; }

        #fox-code-display {
            width: 100%; height: 35px; background-color: #111; border: 2px solid #555;
            border-radius: 5px; display: flex; align-items: center; justify-content: center;
            font-size: 18px; letter-spacing: 5px; color: #ffcc00; font-weight: bold;
            margin-top: 10px; box-sizing: border-box;
        }

        #reset-save-btn {
            position: fixed; top: 10px; right: 10px; background-color: #a00; color: white;
            border: none; padding: 8px 12px; font-size: 12px; border-radius: 4px; cursor: pointer; z-index: 1000;
        }
        #reset-save-btn:hover { background-color: #d00; }

        #notepad-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.85); z-index: 100; display: none;
            justify-content: center; align-items: center; cursor: pointer;
        }

        #notepad-container { position: relative; display: inline-block; cursor: default; }

        #notepad-img {
            max-width: 550px; max-height: 480px; object-fit: contain; display: block; 
            filter: drop-shadow(0 0 15px rgba(0,0,0,0.8));
        }

        #notepad-body { position: absolute; top: 15%; left: 14%; width: 72%; height: 70%; display: flex; flex-direction: column; }

        #notepad-textarea {
            width: 100%; height: 255px; background: transparent; border: none; padding: 0;
            font-family: 'Caveat', 'Indie Flower', 'Courier New', cursive, sans-serif;
            font-size: 20px; font-weight: 600; color: #1a1105; resize: none; box-sizing: border-box; outline: none; line-height: 1.3;
        }

        #notepad-footer { display: flex; justify-content: space-between; align-items: center; margin-top: auto; padding-bottom: 2px; }

        .notepad-arrow {
            background: transparent; border: none; color: #332211; font-family: 'Caveat', cursive, sans-serif;
            font-size: 24px; font-weight: bold; cursor: pointer; padding: 0 10px; transition: transform 0.1s ease;
        }
        .notepad-arrow:hover { transform: scale(1.2); color: #1a1105; }

        #notepad-page-indicator { font-size: 16px; color: #332211; font-weight: bold; font-family: 'Caveat', cursive, sans-serif; }
        #notepad-corner-pagenum { position: absolute; bottom: 25px; right: 15px; font-size: 14px; color: #665544; pointer-events: none; font-style: italic; font-family: 'Caveat', cursive, sans-serif; }

        #open-notepad-btn {
            width: 45px; height: 45px; background-image: url('0_anteckningsblock.PNG');
            background-size: cover; background-position: center; background-color: rgba(0, 0, 0, 0.5);
            border: 1px dashed #777; border-radius: 5px; cursor: pointer; display: none;
        }

        #open-companion-btn {
            width: 45px; height: 45px; background-image: url('0_gubbe.PNG');
            background-size: cover; background-position: center; background-color: rgba(0, 0, 0, 0.5);
            border: 1px dashed #777; border-radius: 5px; cursor: pointer; display: none;
        }

        #companion-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.85); z-index: 100; display: none;
            justify-content: center; align-items: center; cursor: pointer;
        }

        #companion-box { position: relative; display: flex; align-items: center; gap: 20px; cursor: default; }
        #companion-popup-img { height: 260px; width: auto; object-fit: contain; filter: drop-shadow(-8px 10px 10px rgba(0,0,0,0.8)); }

        #companion-text-container {
            width: 380px; height: 260px; background-color: #0b0b0b; border: 2px solid #555;
            border-radius: 8px; padding: 12px 15px; box-sizing: border-box; display: flex;
            flex-direction: column; justify-content: space-between; box-shadow: 0 0 15px rgba(0,0,0,0.9);
        }

        #companion-title {
            font-family: 'Caveat', cursive, sans-serif;
            font-size: 22px;
            font-weight: bold;
            color: #ffcc00;
            border-bottom: 1px dashed #444;
            padding-bottom: 4px;
            margin-bottom: 4px;
        }

        #companion-dialogue-text {
            font-family: 'Caveat', cursive, sans-serif; font-size: 18px; font-weight: 600;
            color: #e0d0b0; line-height: 1.25; word-break: break-word; overflow-y: auto; max-height: 110px;
        }

        #companion-prompt-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            border-top: 1px dashed #444;
            padding-top: 4px;
        }

        #companion-hint-question {
            font-family: 'Caveat', cursive, sans-serif;
            font-size: 17px;
            font-weight: bold;
            color: #ffcc00;
        }

        #companion-choices {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .companion-btn {
            background-color: #222;
            color: #ffcc00;
            border: 1px solid #777;
            padding: 2px 15px;
            font-family: 'Caveat', cursive, sans-serif;
            font-size: 17px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
        }
        .companion-btn:hover { background-color: #444; border-color: #ffcc00; }

        #inventory-container {
            display: flex;
            flex-direction: column;
            gap: 5px;
            background-color: rgba(30, 30, 30, 0.95);
            border: 2px solid #555;
            border-radius: 8px;
            padding: 5px;
        }

        .inventory-row {
            display: flex;
            gap: 5px;
            justify-content: center;
        }

        .inventory-slot {
            width: 40px; height: 40px; background-color: rgba(0, 0, 0, 0.5);
            border: 1px dashed #777; border-radius: 4px; display: flex;
            align-items: center; justify-content: center; cursor: pointer;
            position: relative;
        }

        .inventory-slot.selected { border: 2px solid #ffcc00; background-color: rgba(255, 204, 0, 0.2); }
        .inventory-item { width: 32px; height: 32px; object-fit: contain; pointer-events: none; }
        
        /* Förstoringsglas-ikon för inventarieinspektion */
        .inspect-badge {
            position: absolute;
            bottom: 2px;
            right: 2px;
            font-size: 10px;
            background: rgba(0,0,0,0.7);
            border-radius: 50%;
            width: 14px;
            height: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffcc00;
            cursor: pointer;
        }

        #inspect-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.85); z-index: 200; display: none;
            justify-content: center; align-items: center; flex-direction: column; cursor: pointer;
        }

        #inspect-box {
            background-color: #222; border: 2px solid #555; border-radius: 8px;
            padding: 20px; display: flex; flex-direction: column; align-items: center;
            gap: 15px; max-width: 400px; text-align: center; box-shadow: 0 0 25px rgba(0,0,0,0.9);
            cursor: default;
        }

        #inspect-img { max-width: 200px; max-height: 200px; object-fit: contain; }
        #inspect-title { font-size: 20px; font-weight: bold; color: #ffcc00; }
        #inspect-desc { font-size: 14px; color: #ddd; line-height: 1.4; }

        .dropped-item {
            position: absolute; width: 4%; z-index: 4; cursor: pointer;
            transition: transform 0.1s ease; filter: drop-shadow(-8px 10px 6px rgba(0, 0, 0, 0.6));
        }
        .dropped-item:hover { transform: scale(1.1); }
    </style>
</head>
<body>

<button id="reset-save-btn" onclick="resetGameSave()">Rensa sparad data (Börja om)</button>

<div id="game-wrapper">

    function triggerNewHint(level) {
        if (level > unlockedHintLevel) {
            unlockedHintLevel = level;
            saveGame();
        }
    }

    function collectCompanion(event) {
        if (event) event.stopPropagation();
        companionAcquired = true;
        document.getElementById('item-gubbe').style.display = 'none';
        document.getElementById('open-companion-btn').style.display = 'block';
        if (!pickedUpItems.includes('item-gubbe')) pickedUpItems.push('item-gubbe');
        saveGame();
        
        let pickUpDialogue = "Oh, wonderful. You have picked me up. If you are quite frankly so utterly hopeless that you require assistance, just click on my portrait. I shall provide you with hints, though I shall look down upon you with absolute pity for needing them.";
        document.getElementById('companion-overlay').style.display = 'flex';
        document.getElementById('companion-dialogue-text').innerText = pickUpDialogue;
        document.getElementById('companion-prompt-area').style.display = 'flex';
    }

    function openCompanion() {
        let level = Math.min(unlockedHintLevel, companionData.length - 1);
        let data = companionData[level];
        document.getElementById('companion-overlay').style.display = 'flex';
        document.getElementById('companion-dialogue-text').innerText = data.insult;
        document.getElementById('companion-prompt-area').style.display = 'flex';
        saveGame();
    }

    function handleCompanionChoice(choice) {
        let level = Math.min(unlockedHintLevel, companionData.length - 1);
        let data = companionData[level];
        document.getElementById('companion-prompt-area').style.display = 'none';
        document.getElementById('companion-dialogue-text').innerText = (choice === 'yes') ? data.yesHint : data.noReply;
    }

    function closeCompanion() {
        document.getElementById('companion-overlay').style.display = 'none';
    }

    function togglePeriodiskaZoom(event) {
        event.stopPropagation();
        document.getElementById('periodiska-img').classList.toggle('zoomed');
    }

    function saveGame() {
        const gameState = {
            inventory: inventory, currentRoom: currentRoom, eyePlaced: eyePlaced,
            repPlaced: repPlaced, buttonPlaced: buttonPlaced, buttonState: buttonState,
            spakState: spakState, pickedUpItems: pickedUpItems, removedScrews: removedScrews,
            droppedItems: droppedItems, foxUnlocked: foxUnlocked, lockUnlocked: lockUnlocked,
            lockDigits: lockDigits, stationBrannarePlaced: stationBrannarePlaced,
            stationStallningPlaced: stationStallningPlaced, stationKastrullPlaced: stationKastrullPlaced,
            stationEkolvPlaced: stationEkolvPlaced, stationBrannareLit: stationBrannareLit,
            tandareLit: tandareLit, alchemySequence: alchemySequence, alchemySolved: alchemySolved,
            potionInEkolv: potionInEkolv, kastrullPickedUp: kastrullPickedUp, ekolvPickedUp: ekolvPickedUp,
            bookMagical: bookMagical, notepadAcquired: notepadAcquired, companionAcquired: companionAcquired,
            companionMet: companionMet, unlockedHintLevel: unlockedHintLevel
        };
        localStorage.setItem('escapeRoomSave', JSON.stringify(gameState));
    }

    function loadGame() {
        const saved = localStorage.getItem('escapeRoomSave');
        if (saved) {
            const gameState = JSON.parse(saved);
            inventory = gameState.inventory || [];
            currentRoom = gameState.currentRoom || 'rum1';
            eyePlaced = gameState.eyePlaced || false;
            repPlaced = gameState.repPlaced || false;
            buttonPlaced = gameState.buttonPlaced || false;
            buttonState = gameState.buttonState || 0;
            spakState = gameState.spakState || 'ner';
            pickedUpItems = gameState.pickedUpItems || [];
            removedScrews = gameState.removedScrews || [];
            droppedItems = gameState.droppedItems || {};
            foxUnlocked = gameState.foxUnlocked || false;
            lockUnlocked = gameState.lockUnlocked || false;
            lockDigits = gameState.lockDigits || [0, 0, 0, 0];
            stationBrannarePlaced = gameState.stationBrannarePlaced || false;
            stationStallningPlaced = gameState.stationStallningPlaced || false;
            stationKastrullPlaced = gameState.stationKastrullPlaced || false;
            stationEkolvPlaced = gameState.stationEkolvPlaced || false;
            stationBrannareLit = gameState.stationBrannareLit || false;
            tandareLit = gameState.tandareLit || false;
            alchemySequence = gameState.alchemySequence || [];
            alchemySolved = gameState.alchemySolved || false;
            potionInEkolv = gameState.potionInEkolv || false;
            kastrullPickedUp = gameState.kastrullPickedUp || false;
            ekolvPickedUp = gameState.ekolvPickedUp || false;
            bookMagical = gameState.bookMagical || false;
            notepadAcquired = gameState.notepadAcquired || false;
            companionAcquired = gameState.companionAcquired || false;
            companionMet = gameState.companionMet || false;
            unlockedHintLevel = gameState.unlockedHintLevel || 0;

            if (tandareLit) {
                const tandareImgEl = document.getElementById('tandare-img-el');
                if (tandareImgEl) tandareImgEl.src = '2b_tandare.tand.PNG';
            }

            if (bookMagical) {
                const bookEl = document.getElementById('obj_bok');
                if (bookEl) bookEl.src = '2a_bok.magisk.PNG';
                const bookOverlayImg = document.getElementById('bok-overlay-img');
                if (bookOverlayImg) bookOverlayImg.src = '2a_bok.magisk.PNG';
            }

            if (notepadAcquired) {
                document.getElementById('open-notepad-btn').style.display = 'block';
                document.getElementById('item-anteckningsblock').style.display = 'none';
            }
            if (companionAcquired) {
                document.getElementById('open-companion-btn').style.display = 'block';
                document.getElementById('item-gubbe').style.display = 'none';
            }

            if (currentRoom === 'rum1a') goToRoom1A(true);
            else if (currentRoom === 'rum1b') goToRoom1B(true);
            else if (currentRoom === 'rum1c') goToRoom1C(true);
            else if (currentRoom === 'rum1c-rep') goToRoom1CWithRep(true);
            else if (currentRoom === 'rum2') goToRoom2(true);
            else if (currentRoom === 'rum2a') goToRoom2A(true);
            else if (currentRoom === 'rum2b') goToRoom2B(true);
            else goToRoom1(true);

            pickedUpItems.forEach(id => {
                const el = document.getElementById(id);
                if (el) el.style.display = 'none';
            });
            removedScrews.forEach(id => {
                const el = document.getElementById(id);
                if (el) { el.style.display = 'none'; el.classList.remove('unscrewing'); }
                unscrewedCount = removedScrews.length;
            });
            if (eyePlaced) document.getElementById('placerat-oga').style.display = 'block';
            if (buttonPlaced) {
                if (currentRoom === 'rum2') document.getElementById('placerad-knapp').style.display = 'block';
                document.getElementById('knapp-slot').style.display = 'none';
            }
            if (lockUnlocked) {
                document.getElementById('obj_las').style.display = 'none';
                document.getElementById('obj_skapdorr').style.display = 'none';
                ['flaska1', 'flaska2', 'flaska3', 'flaska4', 'obj_brannare'].forEach(id => {
                    if (!pickedUpItems.includes(id)) {
                        const el = document.getElementById(id);
                        if (el) el.style.display = 'block';
                    }
                });
            }
            updateStationUI();
            updateDroppedItemsDisplay();
            updateLockDisplay();
            updateSpakUI();
            updateButtonStateUI();
            updateInventoryDisplay();
            checkFlashlightState();
        }
    }

    function resetGameSave() {
        localStorage.removeItem('escapeRoomSave');
        location.reload();
    }

    function pickUpNotepad() {
        notepadAcquired = true;
        document.getElementById('item-anteckningsblock').style.display = 'none';
        document.getElementById('open-notepad-btn').style.display = 'block';
        if (!pickedUpItems.includes('item-anteckningsblock')) pickedUpItems.push('item-anteckningsblock');
        saveGame();
        toggleNotepad(true);
    }

    function toggleNotepad(show) {
        const overlay = document.getElementById('notepad-overlay');
        overlay.style.display = show ? 'flex' : 'none';
        if (show) {
            document.getElementById('notepad-textarea').value = notepadPages[currentNotepadPage] || "";
            updateNotepadUI();
            saveGame();
        }
    }

    function saveNotepadContent() {
        notepadPages[currentNotepadPage] = document.getElementById('notepad-textarea').value;
        saveGame();
    }

    function changeNotepadPage(direction) {
        currentNotepadPage += direction;
        if (currentNotepadPage < 0) currentNotepadPage = 0;
        else if (currentNotepadPage >= notepadPages.length) notepadPages.push("");
        document.getElementById('notepad-textarea').value = notepadPages[currentNotepadPage] || "";
        updateNotepadUI();
        saveGame();
    }

    function updateNotepadUI() {
        document.getElementById('notepad-page-indicator').innerText = `Sida ${currentNotepadPage + 1} / ${notepadPages.length}`;
        document.getElementById('notepad-corner-pagenum').innerText = `Sida ${currentNotepadPage + 1}`;
    }

    function changeLockDigit(index) {
        if (lockUnlocked) return;
        lockDigits[index] = (lockDigits[index] + 1) % 10;
        updateLockDisplay();
        if (lockDigits.join('') === '5492') {
            lockUnlocked = true;
            triggerNewHint(3);
            saveGame();
            setTimeout(() => {
                closePopup('las-overlay');
                document.getElementById('obj_las').style.display = 'none';
                document.getElementById('obj_skapdorr').style.display = 'none';
                ['flaska1', 'flaska2', 'flaska3', 'flaska4', 'obj_brannare'].forEach(id => {
                    if (!pickedUpItems.includes(id)) {
                        const el = document.getElementById(id);
                        if (el) el.style.display = 'block';
                    }
                });
            }, 300);
        } else { saveGame(); }
    }

    function updateLockDisplay() {
        for (let i = 0; i < 4; i++) {
            const el = document.getElementById(`lock-digit-${i}`);
            if (el) el.innerText = lockDigits[i];
        }
    }

    function pickUpItem(itemId, imageSrc, itemName) {
        if (inventory.length >= 10) return;
        const el = document.getElementById(itemId);
        if (el) {
            el.style.display = 'none';
            inventory.push({ id: itemId, name: itemName, src: imageSrc });
            if (!pickedUpItems.includes(itemId)) pickedUpItems.push(itemId);
            if (droppedItems[currentRoom]) {
                droppedItems[currentRoom] = droppedItems[currentRoom].filter(item => item.uniqueId !== itemId && item.id !== itemId);
            }
            updateDroppedItemsDisplay();
            updateInventoryDisplay();
            checkFlashlightState();
            saveGame();
        }
    }

    function lightUpTandare(event) {
        if (event) event.stopPropagation();
        tandareLit = true;
        document.getElementById('tandare-img-el').src = '2b_tandare.tand.PNG';
        saveGame();
    }

    function pickUpTandareFromOverlay(event) {
        if (event) event.stopPropagation();
        if (inventory.length >= 10) return;

        let itemToAdd = tandareLit ? 
            { id: 'item-tandare-lysand', name: 'Tänd tändare', src: '2b_tandare.tand.PNG' } : 
            { id: 'item-tandare', name: 'Tändare', src: '2b_tandare.PNG' };
        
        let existingIndex = inventory.findIndex(item => item.name === 'Tändare' || item.name === 'Tänd tändare');
        if (existingIndex !== -1) {
            inventory[existingIndex] = itemToAdd;
        } else {
            inventory.push(itemToAdd);
            if (!pickedUpItems.includes(itemToAdd.id)) pickedUpItems.push(itemToAdd.id);
        }

        updateInventoryDisplay();
        closePopup('tandare-overlay');
        saveGame();
    }

    function placeItemOnStation() {
        if (selectedIndex === null || !inventory[selectedIndex]) return;
        let item = inventory[selectedIndex];

        if (item.name === 'Brännare' || item.name === 'Tänd brännare') {
            stationBrannarePlaced = true;
        } else if (item.name === 'Ställning') {
            stationStallningPlaced = true;
        } else if (item.name === 'Kastrull') {
            stationKastrullPlaced = true;
            kastrullPickedUp = false;
        } else if (item.name === 'Tom E-kolv') {
            stationEkolvPlaced = true;
            ekolvPickedUp = false;
        } else {
            return; 
        }

        inventory.splice(selectedIndex, 1);
        selectedIndex = null;
        updateStationUI();
        updateInventoryDisplay();
        saveGame();
    }

    function lightUpStationBrannare(event) {
        if (event) event.stopPropagation();
        if (stationBrannarePlaced && !stationBrannareLit) {
            if (selectedIndex !== null && inventory[selectedIndex]) {
                let item = inventory[selectedIndex];
                if (item.name === 'Tänd tändare') {
                    stationBrannareLit = true;
                    updateStationUI();
                    saveGame();
                }
            }
        }
    }

    function pourBottleOnStation(event) {
        if (event) event.stopPropagation();
        if (!stationKastrullPlaced || kastrullPickedUp || !stationBrannareLit || alchemySolved) return;
        if (selectedIndex === null || !inventory[selectedIndex]) return;

        let item = inventory[selectedIndex];
        if (['Flaska 1', 'Flaska 2', 'Flaska 3', 'Flaska 4'].includes(item.name)) {
            alchemySequence.push({ name: item.name, src: item.src, id: item.id });
            inventory.splice(selectedIndex, 1);
            selectedIndex = null;
            updateInventoryDisplay();

            const correctSequence = ['Flaska 3', 'Flaska 1', 'Flaska 4'];
            let isCorrectSoFar = true;
            for (let i = 0; i < alchemySequence.length; i++) {
                if (alchemySequence[i].name !== correctSequence[i]) {
                    isCorrectSoFar = false;
                    break;
                }
            }

            if (!isCorrectSoFar) {
                alchemySequence.forEach(bottle => {
                    if (inventory.length < 10) {
                        inventory.push({ id: bottle.id, name: bottle.name, src: bottle.src });
                    } else {
                        if (!droppedItems['rum2b']) droppedItems['rum2b'] = [];
                        let uniqueId = 'dropped_' + bottle.id + '_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5);
                        droppedItems['rum2b'].push({ uniqueId: uniqueId, id: bottle.id, name: bottle.name, src: bottle.src, x: 60, y: 70 });
                    }
                });
                alchemySequence = [];
            } else if (alchemySequence.length === correctSequence.length) {
                alchemySolved = true;
                triggerNewHint(5);
            }
            updateStationUI();
            updateDroppedItemsDisplay();
            saveGame();
        }
    }

    function handleStationKastrullClick(event) {
        if (event) event.stopPropagation();
        if (alchemySolved && !kastrullPickedUp && !potionInEkolv) {
            if (inventory.length < 10) {
                kastrullPickedUp = true; 
                inventory.push({ id: 'green-light-item', name: 'Lyst kastrull', src: '2b_kastrull.lysand.PNG' });
                updateStationUI();
                updateInventoryDisplay();
                saveGame();
            }
        } else {
            pourBottleOnStation(event);
        }
    }

    function handleStationEkolvClick(event) {
        if (event) event.stopPropagation();
        
        if (selectedIndex !== null && inventory[selectedIndex] && inventory[selectedIndex].name === 'Lyst kastrull' && alchemySolved && stationEkolvPlaced && !potionInEkolv) {
            potionInEkolv = true;
            kastrullPickedUp = false; 
            inventory.splice(selectedIndex, 1); 
            selectedIndex = null;
            updateStationUI();
            updateInventoryDisplay();
            saveGame();
        }
        else if (potionInEkolv && stationEkolvPlaced && !ekolvPickedUp) {
            if (inventory.length < 10) {
                ekolvPickedUp = true;
                triggerNewHint(6);
                inventory.push({ id: 'fylld-ekolv', name: 'Fylld E-kolv', src: '2b_ekolv.full.PNG' });
                updateStationUI();
                updateInventoryDisplay();
                saveGame();
            }
        }
    }

    function updateStationUI() {
        const kastrullEl = document.getElementById('station-placed-kastrull');
        const ekolvEl = document.getElementById('station-placed-ekolv');

        kastrullEl.style.display = (stationKastrullPlaced && !kastrullPickedUp) ? 'block' : 'none';
        ekolvEl.style.display = (stationEkolvPlaced && !ekolvPickedUp) ? 'block' : 'none';
        document.getElementById('station-placed-brannare').style.display = stationBrannarePlaced ? 'block' : 'none';
        document.getElementById('station-placed-stallning').style.display = stationStallningPlaced ? 'block' : 'none';
        document.getElementById('station-placed-flamma').style.display = (stationBrannarePlaced && stationBrannareLit) ? 'block' : 'none';
        
        document.getElementById('station-white-light').style.display = (alchemySequence.length > 0 && !alchemySolved) ? 'block' : 'none';
        
        let showStationGreen = alchemySolved && stationKastrullPlaced && !kastrullPickedUp && !potionInEkolv;
        let showEkolvGreen = alchemySolved && potionInEkolv && !ekolvPickedUp;

        document.getElementById('station-green-light').style.display = showStationGreen ? 'block' : 'none';
        document.getElementById('ekolv-green-light').style.display = showEkolvGreen ? 'block' : 'none';
    }

    function handleBookOverlayClick(event) {
        event.stopPropagation();
        if (selectedIndex !== null && inventory[selectedIndex] && inventory[selectedIndex].name === 'Fylld E-kolv') {
            bookMagical = true;
            document.getElementById('obj_bok').src = '2a_bok.magisk.PNG';
            document.getElementById('bok-overlay-img').src = '2a_bok.magisk.PNG';
            inventory.splice(selectedIndex, 1);
            selectedIndex = null;
            updateInventoryDisplay();
            saveGame();
        }
    }

    function handleGameContainerClick(event) {
        if (selectedIndex === null || !inventory[selectedIndex]) return;
        if (event.target !== event.currentTarget && event.target.id !== 'background') return;
        const rect = gameContainer.getBoundingClientRect();
        const clickX = ((event.clientX - rect.left) / rect.width) * 100;
        const clickY = ((event.clientY - rect.top) / rect.height) * 100;
        let item = inventory[selectedIndex];
        if (!droppedItems[currentRoom]) droppedItems[currentRoom] = [];
        
        let uniqueId = 'dropped_' + item.id + '_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5);
        droppedItems[currentRoom].push({ uniqueId: uniqueId, id: item.id, name: item.name, src: item.src, x: clickX, y: clickY });
        
        let idx = pickedUpItems.indexOf(item.id);
        if (idx !== -1) pickedUpItems.splice(idx, 1);
        inventory.splice(selectedIndex, 1);
        selectedIndex = null;
        updateDroppedItemsDisplay();
        updateInventoryDisplay();
        checkFlashlightState();
        saveGame();
    }

    function updateDroppedItemsDisplay() {
        const container = document.getElementById('dropped-items-container');
        container.innerHTML = '';
        (droppedItems[currentRoom] || []).forEach(item => {
            const img = document.createElement('img');
            img.src = item.src;
            img.className = 'dropped-item';
            img.id = item.uniqueId;
            img.style.left = item.x + '%';
            img.style.top = item.y + '%';
            img.onclick = (e) => { 
                e.stopPropagation(); 
                if (inventory.length < 10) {
                    inventory.push({ id: item.id, name: item.name, src: item.src });
                    droppedItems[currentRoom] = droppedItems[currentRoom].filter(d => d.uniqueId !== item.uniqueId);
                    updateDroppedItemsDisplay();
                    updateInventoryDisplay();
                    checkFlashlightState();
                    saveGame();
                }
            };
            container.appendChild(img);
        });
    }

    function returnItemToShelf() {
        if (currentRoom === 'rum1' && selectedIndex !== null && inventory[selectedIndex]) {
            let item = inventory[selectedIndex];
            let idx = pickedUpItems.indexOf(item.id);
            if (idx !== -1) pickedUpItems.splice(idx, 1);
            const el = document.getElementById(item.id);
            if (el) el.style.display = 'block';
            inventory.splice(selectedIndex, 1); selectedIndex = null;
            updateInventoryDisplay(); checkFlashlightState(); saveGame();
        }
    }

    function returnItemToShelfRum2A() {
        if (currentRoom === 'rum2a' && selectedIndex !== null && inventory[selectedIndex]) {
            let item = inventory[selectedIndex];
            if (['Flaska 1', 'Flaska 2', 'Flaska 3', 'Flaska 4', 'Brännare', 'Tänd brännare'].includes(item.name)) {
                let idx = pickedUpItems.indexOf(item.id);
                if (idx !== -1) pickedUpItems.splice(idx, 1);
                const el = document.getElementById(item.id);
                if (el) el.style.display = 'block';
                inventory.splice(selectedIndex, 1); selectedIndex = null;
                updateInventoryDisplay(); checkFlashlightState(); saveGame();
            }
        }
    }

    function updateInventoryDisplay() {
        for (let i = 0; i < 10; i++) {
            const slot = document.getElementById(`slot-${i}`);
            slot.innerHTML = '';
            slot.classList.remove('selected');
            if (inventory[i]) {
                const img = document.createElement('img');
                img.src = inventory[i].src;
                img.className = 'inventory-item';
                slot.appendChild(img);
                
                // Förstoringsglas-ikon för att inspektera föremål
                const badge = document.createElement('div');
                badge.className = 'inspect-badge';
                badge.innerText = '🔍';
                badge.title = 'Inspektera';
                badge.onclick = (e) => {
                    e.stopPropagation();
                    inspectItem(i);
                };
                slot.appendChild(badge);
            }
        }
        if (selectedIndex !== null && inventory[selectedIndex]) {
            document.getElementById(`slot-${selectedIndex}`).classList.add('selected');
        }
    }

    function handleSlotClick(index) {
        if (!inventory[index]) { selectedIndex = null; updateInventoryDisplay(); checkFlashlightState(); return; }
        
        if (selectedIndex === null) {
            selectedIndex = index;
            document.getElementById(`slot-${index}`).classList.add('selected');
        } else if (selectedIndex === index) {
            selectedIndex = null;
            updateInventoryDisplay();
        } else {
            let item1 = inventory[selectedIndex], item2 = inventory[index];
            if ((item1.name === 'Batteri' && item2.name === 'Ficklampa') || (item1.name === 'Ficklampa' && item2.name === 'Batteri')) {
                let fIdx = item1.name === 'Ficklampa' ? selectedIndex : index;
                let bIdx = item1.name === 'Batteri' ? selectedIndex : index;
                inventory[fIdx] = { id: 'item-ficklampa-lysand', name: 'Tänd ficklampa', src: '1_ficklampalysande.PNG' };
                inventory.splice(bIdx, 1); selectedIndex = null;
                updateInventoryDisplay(); saveGame();
            } else {
                selectedIndex = index;
                updateInventoryDisplay();
            }
        }
        checkFlashlightState();
    }

    function inspectItem(index) {
        const item = inventory[index];
        if (!item) return;
        document.getElementById('inspect-title').innerText = item.name;
        document.getElementById('inspect-img').src = item.src;
        document.getElementById('inspect-desc').innerText = itemDescriptions[item.name] || 'Ett föremål du bär med dig.';
        document.getElementById('inspect-overlay').style.display = 'flex';
    }

    function closeInspect() {

    function checkFlashlightState() {
        const flashlightOverlay = document.getElementById('flashlight-overlay');
        if (currentRoom === 'rum1a') {
            flashlightOverlay.style.display = 'block';
            let activeItem = selectedIndex !== null ? inventory[selectedIndex] : null;
            if (activeItem && activeItem.name === 'Tänd ficklampa') {
                flashlightOverlay.style.background = `radial-gradient(circle 160px at ${mouseX}px ${mouseY}px, rgba(0,0,0,0) 0%, rgba(0,0,0,0.85) 70%, rgba(0,0,0,0.98) 100%)`;
            } else {
                flashlightOverlay.style.background = 'rgba(0, 0, 0, 0.98)';
            }
        } else {
            flashlightOverlay.style.display = 'none';
        }
    }

    const gameContainer = document.getElementById('game-container');
    gameContainer.addEventListener('mousemove', (e) => {
        const rect = gameContainer.getBoundingClientRect();
        mouseX = e.clientX - rect.left;
        mouseY = e.clientY - rect.top;
        if (currentRoom === 'rum1a') {
            let activeItem = selectedIndex !== null ? inventory[selectedIndex] : null;
            if (activeItem && activeItem.name === 'Tänd ficklampa') {
                const flashlightOverlay = document.getElementById('flashlight-overlay');
                flashlightOverlay.style.background = `radial-gradient(circle 160px at ${mouseX}px ${mouseY}px, rgba(0,0,0,0) 0%, rgba(0,0,0,0.85) 70%, rgba(0,0,0,0.98) 100%)`;
            }
        }
    });

    function clickRavtavla() {
        if (foxUnlocked) { if (repPlaced) goToRoom1CWithRep(); else goToRoom1C(); }
        else openPopup('ravtavla-overlay');
    }

    function clickFageltavla() {
        if (unscrewedCount === 4) goToRoom1A();
        else openPopup('fageltavla-overlay');
    }

    function pressFoxDigit(digit) {
        if (foxUnlocked) return;
        foxInputCode += digit;
        updateFoxDisplay();
        if (foxInputCode.length === 5) {
            if (foxInputCode === "46793") {
                foxUnlocked = true;
                document.getElementById('fox-code-display').innerText = "RÄTT!";
                document.getElementById('fox-code-display').style.color = "#00ff00";
                saveGame();
                setTimeout(() => { closePopup('ravtavla-overlay'); goToRoom1C(); }, 1000);
            } else {
                document.getElementById('fox-code-display').innerText = "FEL!";
                document.getElementById('fox-code-display').style.color = "#ff0000";
                setTimeout(() => { foxInputCode = ""; updateFoxDisplay(); }, 800);
            }
        }
    }

    function updateFoxDisplay() {
        const display = document.getElementById('fox-code-display');
        if (foxUnlocked) { display.innerText = "ÖPPNAD"; display.style.color = "#00ff00"; return; }
        display.style.color = "#ffcc00";
        let text = foxInputCode;
        while (text.length < 5) text += "_";
        display.innerText = text;
    }

    function placeEyeOnDeer() {
        if (!eyePlaced && selectedIndex !== null && inventory[selectedIndex] && inventory[selectedIndex].name === 'Öga') {
            eyePlaced = true;
            document.getElementById('placerat-oga').style.display = 'block';
            inventory.splice(selectedIndex, 1); selectedIndex = null;
            updateInventoryDisplay(); checkFlashlightState(); saveGame();
            setTimeout(() => { closePopup('hjorttavla-overlay'); goToRoom1B(); }, 800);
        } else if (eyePlaced) {
            closePopup('hjorttavla-overlay'); goToRoom1B();
        }
    }

    function unscrew(skruvId) {
        if (selectedIndex !== null && inventory[selectedIndex] && inventory[selectedIndex].name === 'Skruvmejsel') {
            const el = document.getElementById(skruvId);
            if (el && !el.classList.contains('unscrewing') && el.style.display !== 'none') {
                el.classList.add('unscrewing');
                if (!removedScrews.includes(skruvId)) removedScrews.push(skruvId);
                setTimeout(() => {
                    el.style.display = 'none';
                    unscrewedCount = removedScrews.length;
                    saveGame();
                    if (unscrewedCount === 4) {
                        setTimeout(() => { closePopup('fageltavla-overlay'); goToRoom1A(); }, 400);
                    }
                }, 500);
            }
        }
    }

    function toggleSpak() {

    function updateSpakUI() {
        const el = document.getElementById('obj_spak');
        const lightEl = document.getElementById('spak-light');
        const openLuckaEl = document.getElementById('rum2-oppen-lucka');
        const receptLappEl = document.getElementById('rum2-recept-lapp');

        if (el) {
            if (spakState === 'upp') {
                el.style.transform = 'translateY(-15px)';
                if (lightEl) {
                    lightEl.style.display = 'block';
                    // Blinkande effekt som sedan tonas ner eller försvinner vid behov
                    lightEl.style.opacity = '1';
                    setTimeout(() => { lightEl.style.opacity = '0.3'; }, 1000);
                }
            } else {
                el.style.transform = 'translateY(0px)';
                if (lightEl) lightEl.style.display = 'none';
            }
        }
        let luckaVisible = (spakState === 'upp' && currentRoom === 'rum2');
        if (openLuckaEl) openLuckaEl.style.display = luckaVisible ? 'block' : 'none';
        if (receptLappEl) receptLappEl.style.display = luckaVisible ? 'block' : 'none';
    }
